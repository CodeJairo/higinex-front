<aside class="hidden lg:block w-80 bg-base-100 border-r border-base-300 h-full overflow-y-auto">
  <div class="p-6">
    <div class="flex items-center gap-2 mb-6">
      <lucide-icon [img]="filterIcon" class="w-5 h-5 text-primary"></lucide-icon>
      <h2 class="text-base-content font-bold">Filtros</h2>
    </div>

    <div class="space-y-4">
      <!-- Products -->
      <div class="border-b border-base-200 pb-4">
        <button (click)="toggleSection('products')"
          class="w-full flex items-center justify-between py-3 hover:text-primary transition-colors cursor-pointer">
          <span class="text-base-content">Productos</span>
          @if (isSectionExpanded('products')) {
          <lucide-icon [img]="chevronUpIcon" class="w-4 h-4 text-base-content/50"></lucide-icon>
          } @else {
          <lucide-icon [img]="chevronDownIcon" class="w-4 h-4 text-base-content/50"></lucide-icon>
          }
        </button>
        @if (isSectionExpanded('products')) {
        <div class="mt-2 space-y-2">
          @if (sortedProducts().length === 0) {
          <p class="text-sm text-base-content/60">No hay productos disponibles.</p>
          } @else { @for (product of sortedProducts(); track product.id) {
          <label class="flex items-center gap-3 cursor-pointer group">
            <input type="checkbox" [checked]="isProductSelected(product.id)" (change)="toggleProduct(product.id)"
              class="checkbox checkbox-primary checkbox-sm" />
            <span class="flex-1 text-sm text-base-content/80 group-hover:text-base-content transition-colors">
              {{ product.name }}
            </span>
          </label>
          } }
        </div>
        }
      </div>
    </div>

    <!-- Clear Filters -->
    <button (click)="clearFilters()"
      class="w-full mt-6 py-2 text-sm text-primary hover:text-primary-focus hover:bg-primary/10 rounded-lg transition-colors cursor-pointer">
      Limpiar filtros
    </button>
  </div>
</aside>
