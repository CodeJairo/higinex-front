<footer class="mt-auto border-t border-black/[0.06] bg-white/70 backdrop-blur-md py-6 sm:py-7 relative z-10">
  <div class="max-w-[1680px] 3xl:max-w-[1780px] mx-auto px-4 sm:px-6 lg:px-8 2xl:px-12">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
      <!-- Brand & Tagline -->
      <div class="flex items-center gap-3 text-center sm:text-left">
        <div class="w-8 h-8 rounded-xl bg-white shadow-xs border border-black/[0.06] flex items-center justify-center shrink-0">
          <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-contain p-1" />
        </div>
        <div class="text-left">
          <span class="text-xs sm:text-sm font-extrabold text-base-content tracking-tight block">Higinex S.A.S</span>
          <span class="text-[10px] sm:text-[11px] text-base-content/60 block">Suministros Institucionales B2B</span>
        </div>
      </div>

      <!-- Info Pills: Dirección & Teléfono -->
      <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-xs">
        <!-- Address Pill -->
        <a
          href="https://www.google.com/maps/search/?api=1&query=CL+9+SUR+79C+115+MEDELLIN"
          target="_blank"
          rel="noopener noreferrer"
          class="h-9 px-3.5 sm:px-4 rounded-full bg-black/[0.03] hover:bg-black/[0.06] border border-black/[0.06] text-base-content/75 hover:text-primary transition-all flex items-center gap-2 shadow-xs group"
          title="Ver ubicación en Google Maps"
        >
          <lucide-icon [img]="mapPinIcon" class="w-3.5 h-3.5 text-primary shrink-0 group-hover:scale-110 transition-transform"></lucide-icon>
          <span class="font-medium text-[11px] sm:text-xs">CL 9 SUR 79C 115, MEDELLÍN</span>
        </a>

        <!-- Phone / WhatsApp Pill -->
        <a
          href="tel:+573042729943"
          class="h-9 px-3.5 sm:px-4 rounded-full bg-emerald-500/10 hover:bg-emerald-500/15 border border-emerald-500/20 text-emerald-800 hover:text-emerald-900 transition-all flex items-center gap-2 shadow-xs group"
          title="Llamar o contactar por WhatsApp"
        >
          <lucide-icon [img]="phoneIcon" class="w-3.5 h-3.5 text-emerald-600 shrink-0 group-hover:scale-110 transition-transform"></lucide-icon>
          <span class="font-bold text-[11px] sm:text-xs">+57 304 272 9943</span>
        </a>
      </div>

      <!-- Copyright -->
      <div class="text-center md:text-right">
        <p class="text-[11px] text-base-content/50 font-medium">
          &copy; {{ currentYear }} Higinex. Todos los derechos reservados.
        </p>
      </div>
    </div>
  </div>
</footer>
