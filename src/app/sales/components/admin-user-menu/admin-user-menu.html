<div class="dropdown dropdown-end">
  <button
    tabindex="0"
    type="button"
    class="btn btn-ghost hover:bg-base-200 gap-3 px-2 h-14 rounded-2xl transition-all duration-300 min-w-0"
  >
    <div
      class="w-10 h-10 rounded-xl bg-base-200 flex items-center justify-center shrink-0 shadow-inner border border-base-300"
    >
      <lucide-icon [img]="userIcon" class="w-5 h-5 text-base-content"></lucide-icon>
    </div>

    <div class="hidden lg:flex flex-col items-start text-left leading-none min-w-0 max-w-35">
      <span class="text-sm font-black text-base-content uppercase tracking-tighter truncate w-full">
        {{ userName }}
      </span>
      <div class="flex items-center gap-1.5 mt-1 w-full">
        <span class="w-1.5 h-1.5 rounded-full bg-success shrink-0"></span>
        <span class="text-[9px] font-black text-success uppercase tracking-widest truncate"
          >Administrador</span
        >
        @if (isDemoMode()) {
          <span
            class="px-1.5 py-0.5 bg-violet-500 text-white text-[8px] font-black uppercase tracking-wider rounded"
            >DEMO</span
          >
        }
      </div>
    </div>
  </button>

  <div
    tabindex="0"
    class="dropdown-content mt-4 z-60 w-72 shadow-[0_20px_60px_rgba(0,0,0,0.15)] bg-base-100 rounded-2xl border border-base-200 overflow-hidden animate-in fade-in slide-in-from-top-2"
  >
    <div class="px-6 py-6 bg-base-200 relative overflow-hidden min-w-0">
      <div
        class="absolute top-0 right-0 w-32 h-32 bg-success/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"
      ></div>

      <div class="relative z-10 min-w-0">
        <span
          class="inline-block px-2 py-0.5 rounded bg-success text-[9px] font-black uppercase tracking-widest mb-2 shrink-0 text-success-content"
        >
          Higinex Staff
        </span>
        <p class="text-sm font-black truncate tracking-tight uppercase leading-none w-full">
          {{ userName }}
        </p>
        <p class="text-[11px] truncate mt-2 font-medium w-full">
          {{ userDetail }}
        </p>
      </div>
    </div>

    <ul class="menu p-3 space-y-0.5 w-full">
      <li
        class="menu-title px-3 pt-3 pb-1 text-[9px] font-black uppercase tracking-[0.2em] text-base-content/40"
      >
        Gestión Global
      </li>

      <li>
        <button
          routerLink="/admin/dashboard"
          class="flex items-center gap-3 px-3 py-3 rounded-xl bg-base-200 hover:bg-base-300 transition-all shadow-md active:scale-[0.98]"
        >
          <lucide-icon [img]="shieldUserIcon" class="w-4 h-4 text-success"></lucide-icon>
          <span class="text-xs font-black uppercase tracking-widest">Panel de Control</span>
        </button>
      </li>

      <li
        class="menu-title px-3 pt-4 pb-1 text-[9px] font-black uppercase tracking-[0.2em] text-base-content/40"
      >
        Operaciones
      </li>

      <li>
        <button
          routerLink="/admin/orders"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-base-200 transition-colors group"
        >
          <lucide-icon
            [img]="packageIcon"
            class="w-4 h-4 text-base-content/40 group-hover:text-base-content"
          ></lucide-icon>
          <span class="text-xs font-bold text-base-content">Gestión de Pedidos</span>
        </button>
      </li>
      <li>
        <button
          routerLink="/admin/billing"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-base-200 transition-colors group"
        >
          <lucide-icon
            [img]="fileTextIcon"
            class="w-4 h-4 text-base-content/40 group-hover:text-base-content"
          ></lucide-icon>
          <span class="text-xs font-bold text-base-content">Reportes Financieros</span>
        </button>
      </li>
      <li>
        <button
          routerLink="/customer/appearance"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-base-200 transition-colors group"
        >
          <lucide-icon
            [img]="settingsIcon"
            class="w-4 h-4 text-base-content/40 group-hover:text-base-content"
          ></lucide-icon>
          <span class="text-xs font-bold text-base-content">Configuración</span>
        </button>
      </li>

      <div class="h-px bg-base-200 my-3 mx-3"></div>

      <li>
        <button
          (click)="onLogout()"
          class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-error/10 text-error transition-colors group"
        >
          <lucide-icon [img]="logoutIcon" class="w-4 h-4"></lucide-icon>
          <span class="text-xs font-black uppercase tracking-widest">Desconectar</span>
        </button>
      </li>
    </ul>
  </div>
</div>
