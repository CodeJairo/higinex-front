<div class="navbar px-4 lg:px-6 h-16">
  <!-- LEFT: Logo -->
  <div class="navbar-start">
    <button
      (click)="goToCatalog()"
      class="btn btn-ghost gap-3 px-0 min-h-0 h-auto hover:opacity-80 transition-opacity"
    >
      <div
        class="w-10 h-10 bg-white flex items-center justify-center shrink-0 rounded-xl overflow-hidden border border-slate-100"
      >
        <svg
          width="40"
          height="40"
          viewBox="0 0 40 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect width="40" height="40" fill="white" />
          <path d="M8 8H12V32H8V8Z" fill="#0EA5E9" />
          <path d="M16 8H20V32H16V8Z" fill="#0EA5E9" />
          <path d="M24 8H28V32H24V8Z" fill="#0EA5E9" />
          <path d="M8 18H28V22H8V18Z" fill="#0EA5E9" />
          <circle cx="32" cy="12" r="3" fill="#10B981" />
          <circle cx="32" cy="28" r="3" fill="#10B981" />
        </svg>
      </div>
      <div class="flex flex-col items-start min-w-0">
        <span class="text-base font-semibold text-slate-900 leading-tight truncate"> Higinex </span>
        <span class="text-xs text-slate-500 truncate"> Confianza en cada producto </span>
      </div>
    </button>
  </div>

  <!-- CENTER: Search (desktop) -->
  <div class="navbar-center not-md:hidden">
    <div class="w-full max-w-xl">
      <label
        class="input input-bordered w-full flex items-center gap-2 rounded-full bg-slate-50/80"
      >
        <lucide-icon [img]="searchIcon" class="w-4 h-4 text-slate-400"></lucide-icon>

        <input
          type="text"
          placeholder="Buscar productos..."
          class="grow text-sm bg-transparent focus:outline-none"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          (focus)="goToCatalog()"
        />
      </label>
    </div>
  </div>

  <!-- RIGHT: Cart + User -->
  <div class="navbar-end gap-2 sm:gap-3">
    <!-- Cart (DaisyUI indicator) -->
    <div class="indicator">
      @if (totalItems() > 0) {
        <span class="indicator-item badge badge-sm badge-primary">
          {{ totalItems() }}
        </span>
      }
      <button type="button" class="btn btn-ghost btn-square" (click)="toggleCart()">
        <lucide-icon [img]="cartIcon" class="w-5 h-5 text-slate-700"></lucide-icon>
      </button>
    </div>

    <!-- User menu (dos componentes según rol) -->
    @if (hasUser()) { @if (isAdmin()) {
    <sales-admin-user-menu
      [userName]="userDisplayName()"
      [userDetail]="userDisplayDetail()"
      (logout)="logout()"
    ></sales-admin-user-menu>
    } @else {
    <sales-customer-user-menu
      [userName]="userDisplayName()"
      [userDetail]="userDisplayDetail()"
      (logout)="logout()"
    ></sales-customer-user-menu>
    } }
  </div>
</div>

<!-- Mobile search debajo -->
<div class="md:hidden px-4 pb-3">
  <div class="flex justify-center w-full">
    <div class="w-full max-w-xl">
      <label
        class="input input-bordered w-full flex items-center gap-2 rounded-full bg-slate-50/80"
      >
        <lucide-icon [img]="searchIcon" class="w-4 h-4 text-slate-400"></lucide-icon>

        <input
          type="text"
          placeholder="Buscar productos..."
          class="grow text-sm bg-transparent focus:outline-none"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          (focus)="goToCatalog()"
        />
      </label>
    </div>
  </div>
</div>

<!-- Cart Dropdown (lo mantengo como lo tienes) -->
<sales-cart-dropdown
  [isOpen]="showCart()"
  [items]="cartItems()"
  (closeCart)="closeCart()"
  (updateQuantity)="updateQuantity($event.variantId, $event.quantity)"
  (removeItem)="removeItem($event)"
  (clearCart)="clearCart()"
></sales-cart-dropdown>
