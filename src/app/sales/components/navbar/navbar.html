<!-- Navbar: Normal Edge-to-Edge on Mobile, Floating iOS Glass on Desktop -->
<header
  class="fixed top-0 inset-x-0 z-50 p-0 sm:p-3 pointer-events-auto sm:pointer-events-none transition-all duration-300 ease-in-out"
  [class.-translate-y-full]="!isVisible()"
  [class.translate-y-0]="isVisible()"
>
  <nav
    class="w-full max-w-[1680px] 3xl:max-w-[1780px] mx-auto rounded-none sm:rounded-[24px] bg-base-100/95 dark:bg-slate-900/95 backdrop-blur-md sm:ios-glass border-b border-base-200/80 dark:border-slate-800/80 sm:border transition-all duration-300 pointer-events-auto shadow-xs sm:shadow-lg"
    [class.ios-glass-scrolled]="hasScrolled()"
  >
    <div class="px-4 sm:px-6 h-14 sm:h-15 2xl:h-16 flex items-center justify-between gap-3 sm:gap-6">
      <!-- Start: Brand Logo & Title -->
      <div class="flex items-center shrink-0">
        <button
          type="button"
          (click)="goToCatalog()"
          class="group flex items-center gap-2.5 sm:gap-3 hover:opacity-90 transition-all duration-200 cursor-pointer"
        >
          <div
            class="relative w-9 h-9 sm:w-10 sm:h-10 2xl:w-11 2xl:h-11 bg-white/90 rounded-xl sm:rounded-2xl border border-white/80 shadow-[inset_0_1px_1px_rgba(255,255,255,0.9),0_2px_4px_rgba(0,0,0,0.03)] flex items-center justify-center shrink-0 group-hover:scale-105 transition-all duration-200"
          >
            <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-contain p-1.5" />
          </div>
          <div class="flex flex-col items-start leading-none">
            <div class="flex items-center gap-1.5">
              <span class="text-sm sm:text-base 2xl:text-lg font-bold text-base-content tracking-tight">Higinex</span>
              <span class="bg-primary/10 text-primary border border-primary/20 text-[9px] 2xl:text-[10px] font-bold px-2 py-0.5 rounded-full tracking-wider">
                B2B
              </span>
            </div>
            <span class="text-[9px] 2xl:text-[10px] font-medium text-base-content/50 uppercase tracking-widest mt-0.5 hidden xs:inline">
              Suministros
            </span>
          </div>
        </button>
      </div>

      <!-- Center: iOS Spotlight Search Input (Desktop/Tablet) -->
      <div class="hidden md:flex flex-1 max-w-md 2xl:max-w-xl mx-auto">
        <div class="relative w-full group">
          <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-base-content/40 group-focus-within:text-primary transition-colors">
            <lucide-icon [img]="searchIcon" class="w-4 h-4"></lucide-icon>
          </div>
          <input
            type="text"
            placeholder="Buscar por producto, SKU, categoría..."
            class="w-full h-9.5 pl-10 pr-9 rounded-full bg-black/[0.04] hover:bg-black/[0.06] focus:bg-base-100 border border-black/[0.06] focus:border-primary/40 focus:ring-4 focus:ring-primary/10 text-xs sm:text-sm text-base-content placeholder:text-base-content/45 outline-none transition-all duration-200 shadow-[inset_0_1px_2px_rgba(0,0,0,0.03)]"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            (focus)="goToCatalog()"
          />
          @if (searchQuery()) {
            <button
              type="button"
              (click)="clearSearch()"
              class="absolute inset-y-0 right-2.5 flex items-center text-base-content/40 hover:text-base-content transition-colors cursor-pointer"
              title="Borrar búsqueda"
              aria-label="Borrar búsqueda"
            >
              <div class="w-5 h-5 rounded-full bg-base-content/10 flex items-center justify-center">
                <lucide-icon [img]="xIcon" class="w-3 h-3"></lucide-icon>
              </div>
            </button>
          }
        </div>
      </div>

      <!-- End: Cart & User Profile Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
        <!-- Cart Trigger Button -->
        <div class="indicator">
          @if (totalItems() > 0) {
            <span
              class="indicator-item badge badge-primary badge-xs font-bold text-white border-2 border-base-100 scale-90 translate-x-1 -translate-y-1 shadow-xs"
            >
              {{ totalItems() }}
            </span>
          }
          <button
            type="button"
            (click)="toggleCart()"
            class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-black/[0.03] hover:bg-black/[0.06] active:scale-95 border border-black/[0.04] text-base-content/80 hover:text-primary transition-all flex items-center justify-center cursor-pointer"
            title="Ver bolsa de compras"
            aria-label="Ver bolsa de compras"
          >
            <lucide-icon [img]="cartIcon" class="w-4 h-4 sm:w-4.5 sm:h-4.5"></lucide-icon>
          </button>
        </div>

        <div class="h-5 w-px bg-black/[0.08] mx-0.5 sm:mx-1"></div>

        <!-- User Authentication / Profile Menu -->
        <div class="flex items-center">
          @if (hasUser()) {
            @if (isAdmin()) {
              <sales-admin-user-menu
                [userName]="userDisplayName()"
                [userDetail]="userDisplayDetail()"
                (logout)="logout()"
              ></sales-admin-user-menu>
            } @else {
              <sales-customer-user-menu
                [userName]="userDisplayName()"
                [userDetail]="userDisplayDetail()"
                (logout)="logout()"
              ></sales-customer-user-menu>
            }
          } @else {
            <button
              type="button"
              class="btn btn-primary btn-sm rounded-full font-semibold text-xs px-4 text-white shadow-xs"
            >
              Ingresar
            </button>
          }
        </div>
      </div>
    </div>

    <!-- Mobile Search Row (Standard Edge-to-Edge Clean Row) -->
    <div class="md:hidden px-4 pb-2.5 pt-1.5 border-t border-base-200/60 dark:border-slate-800/60 bg-base-100/90 dark:bg-slate-900/90">
      <div class="relative w-full">
        <lucide-icon
          [img]="searchIcon"
          class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-base-content/40"
        ></lucide-icon>
        <input
          type="text"
          placeholder="Buscar productos o SKU..."
          class="w-full h-9 pl-9 pr-8 rounded-xl bg-base-200/70 dark:bg-slate-800/70 focus:bg-base-100 border border-transparent focus:border-primary/40 focus:ring-2 focus:ring-primary/15 text-xs text-base-content placeholder:text-base-content/40 outline-none transition-all"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          (focus)="goToCatalog()"
        />
        @if (searchQuery()) {
          <button
            type="button"
            (click)="clearSearch()"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-base-content/40 hover:text-base-content"
          >
            <div class="w-4 h-4 rounded-full bg-base-content/10 flex items-center justify-center">
              <lucide-icon [img]="xIcon" class="w-2.5 h-2.5"></lucide-icon>
            </div>
          </button>
        }
      </div>
    </div>
  </nav>
</header>

<!-- Dynamic Spacer -->
<div class="h-[102px] md:h-20" aria-hidden="true"></div>

<!-- Connected Dropdown Component -->
<sales-cart-dropdown
  [isOpen]="showCart()"
  [items]="cartItems()"
  (closeCart)="closeCart()"
  (updateQuantity)="updateQuantity($event.variantId, $event.quantity)"
  (removeItem)="removeItem($event)"
  (clearCart)="clearCart()"
></sales-cart-dropdown>
