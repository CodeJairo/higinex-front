<nav
  class="fixed top-0 left-0 right-0 z-50 w-full bg-base-100/80 backdrop-blur-md border-b border-base-200/60 transition-all duration-300 ease-in-out"
  [class.-translate-y-full]="!isVisible()" [class.translate-y-0]="isVisible()" [class.shadow-sm]="hasScrolled()">
  <div class="navbar px-4 lg:px-8 h-20 max-w-480 mx-auto">
    <div class="navbar-start">
      <button (click)="goToCatalog()"
        class="group flex items-center gap-3.5 px-0 hover:opacity-90 transition-all duration-300">
        <div
          class="relative w-12 h-12 bg-base-100 flex items-center justify-center shrink-0 rounded-2xl shadow-sm border border-base-200 group-hover:shadow-md group-hover:-translate-y-0.5 transition-all duration-300">
          <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-cover p-1" />
        </div>
        <div class="flex flex-col items-start min-w-0">
          <span class="text-xl font-black text-base-content leading-none tracking-tighter uppercase">Higinex</span>
          <span class="text-[10px] font-bold text-primary uppercase tracking-[0.15em] mt-1 opacity-80">Premium
            Care</span>
        </div>
      </button>
    </div>

    <div class="navbar-center hidden md:flex w-full max-w-lg">
      <div class="relative w-full group">
        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
          <lucide-icon [img]="searchIcon"
            class="w-4 h-4 text-base-content/40 group-focus-within:text-primary transition-colors"></lucide-icon>
        </div>
        <input type="text" placeholder="Buscar productos..."
          class="w-full bg-base-200/50 border-none focus:ring-2 focus:ring-primary/20 focus:bg-base-100 h-11 pl-11 pr-4 rounded-full text-sm transition-all duration-300 outline-none placeholder:text-base-content/40 text-base-content"
          [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" (focus)="goToCatalog()" />
      </div>
    </div>

    <div class="navbar-end gap-1 sm:gap-4">
      <div class="indicator">
        @if (totalItems() > 0) {
        <span
          class="indicator-item badge badge-primary badge-sm font-bold border-2 border-base-100 scale-90 translate-x-2 -translate-y-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
          <span class="relative">{{ totalItems() }}</span>
        </span>
        }
        <button type="button" class="btn btn-ghost btn-circle hover:bg-base-200 transition-colors"
          (click)="toggleCart()">
          <lucide-icon [img]="cartIcon" class="w-5 h-5 text-base-content/70"></lucide-icon>
        </button>
      </div>

      <div class="pl-2 border-l border-base-200 ml-1 sm:ml-0">
        @if (hasUser()) { @if (isAdmin()) {
        <sales-admin-user-menu [userName]="userDisplayName()" [userDetail]="userDisplayDetail()"
          (logout)="logout()"></sales-admin-user-menu>
        } @else {
        <sales-customer-user-menu [userName]="userDisplayName()" [userDetail]="userDisplayDetail()"
          (logout)="logout()"></sales-customer-user-menu>
        } } @else {
        <button class="btn btn-primary btn-sm rounded-full px-6">Ingresar</button>
        }
      </div>
    </div>
  </div>

  <div class="md:hidden px-4 pb-4">
    <div class="relative w-full">
      <lucide-icon [img]="searchIcon"
        class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-base-content/40"></lucide-icon>
      <input type="text" placeholder="Buscar productos..."
        class="w-full bg-base-200 h-10 pl-11 pr-4 rounded-full text-sm outline-none focus:bg-base-100 focus:ring-2 focus:ring-primary/10 transition-all text-base-content placeholder:text-base-content/40"
        [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" (focus)="goToCatalog()" />
    </div>
  </div>
</nav>

<div class="h-32 md:h-20"></div>

<sales-cart-dropdown [isOpen]="showCart()" [items]="cartItems()" (closeCart)="closeCart()"
  (updateQuantity)="updateQuantity($event.variantId, $event.quantity)" (removeItem)="removeItem($event)"
  (clearCart)="clearCart()"></sales-cart-dropdown>
