<div class="dropdown dropdown-end">
  <button
    tabindex="0"
    type="button"
    class="h-9 sm:h-10 pl-1.5 pr-2.5 sm:pr-3 rounded-full bg-black/[0.03] hover:bg-black/[0.06] border border-black/[0.05] transition-all flex items-center gap-2 cursor-pointer max-w-[180px] sm:max-w-[220px]"
  >
    <div
      class="w-6.5 h-6.5 sm:w-7 sm:h-7 rounded-full bg-primary/10 text-primary border border-primary/20 flex items-center justify-center shrink-0 shadow-2xs"
    >
      <lucide-icon [img]="userIcon" class="w-3.5 h-3.5"></lucide-icon>
    </div>

    <div class="hidden sm:flex flex-col items-start text-left leading-none min-w-0">
      <span class="text-xs font-semibold text-base-content uppercase tracking-tight truncate w-full">
        {{ userName }}
      </span>
      <div class="flex items-center gap-1 mt-0.5">
        <span class="text-[9px] font-medium text-base-content/50 uppercase tracking-wider">
          Cliente
        </span>
        @if (isDemoMode()) {
          <span
            class="px-1 py-0.2 bg-emerald-500/15 text-emerald-700 border border-emerald-500/20 text-[8px] font-bold rounded-full uppercase"
            >DEMO</span
          >
        }
      </div>
    </div>
  </button>

  <div
    tabindex="0"
    class="dropdown-content mt-3 z-60 w-72 ios-glass-card rounded-2xl overflow-hidden animate-in fade-in slide-in-from-top-2"
  >
    <div class="px-5 py-4 border-b border-black/[0.06] min-w-0 bg-black/[0.02]">
      <div class="flex items-center gap-2 mb-1.5">
        <div class="w-2 h-2 rounded-full bg-primary animate-pulse shrink-0"></div>
        <span class="text-[9px] font-bold text-primary uppercase tracking-[0.18em]"
          >Cuenta Activa</span
        >
      </div>
      <p class="text-xs font-bold text-base-content truncate tracking-tight uppercase w-full">
        {{ userName }}
      </p>
      <p class="text-[11px] font-medium text-base-content/50 truncate mt-0.5 w-full">
        {{ userDetail }}
      </p>
    </div>

    <ul class="p-2 space-y-1 w-full text-xs">
      <li class="px-3 pt-2 pb-1 text-[9px] font-bold uppercase tracking-[0.15em] text-base-content/40">
        Mi Cuenta
      </li>

      <li>
        <button
          (click)="goToMyAccount()"
          class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-black/[0.04] transition-colors group cursor-pointer"
        >
          <lucide-icon
            [img]="userCircleIcon"
            class="w-4 h-4 text-base-content/50 group-hover:text-primary transition-colors"
          ></lucide-icon>
          <span class="font-medium text-base-content">Mi Cuenta</span>
        </button>
      </li>

      <li>
        <button
          (click)="goToMyOrders()"
          class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-black/[0.04] transition-colors group cursor-pointer"
        >
          <lucide-icon
            [img]="packageIcon"
            class="w-4 h-4 text-base-content/50 group-hover:text-primary transition-colors"
          ></lucide-icon>
          <span class="font-medium text-base-content">Historial de Pedidos</span>
        </button>
      </li>

      <li>
        <button
          (click)="goToMyAddresses()"
          class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-black/[0.04] transition-colors group cursor-pointer"
        >
          <lucide-icon
            [img]="mapPinIcon"
            class="w-4 h-4 text-base-content/50 group-hover:text-primary transition-colors"
          ></lucide-icon>
          <span class="font-medium text-base-content">Puntos de Entrega</span>
        </button>
      </li>

      <li class="h-px bg-black/[0.06] my-1 mx-2"></li>

      <li>
        <button
          (click)="goToMyAccount()"
          class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-black/[0.04] transition-colors group cursor-pointer"
        >
          <lucide-icon
            [img]="helpIcon"
            class="w-4 h-4 text-base-content/50 group-hover:text-primary transition-colors"
          ></lucide-icon>
          <span class="font-medium text-base-content">Centro de Soporte</span>
        </button>
      </li>

      <li class="h-px bg-black/[0.06] my-1 mx-2"></li>

      <li>
        <button
          (click)="onLogout()"
          class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-error/10 text-error transition-colors group cursor-pointer"
        >
          <lucide-icon [img]="logoutIcon" class="w-4 h-4"></lucide-icon>
          <span class="text-xs font-bold uppercase tracking-wider">Cerrar Sesión</span>
        </button>
      </li>
    </ul>
  </div>
</div>
