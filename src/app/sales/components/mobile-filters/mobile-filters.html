<!-- Backdrop -->
<div class="fixed inset-0 bg-neutral/50 z-40 lg:hidden cursor-pointer" (click)="close()"></div>

<!-- Modal -->
<div class="fixed inset-x-0 bottom-0 bg-base-100 rounded-t-2xl z-50 lg:hidden max-h-[85vh] flex flex-col">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-base-200">
    <h2 class="text-base-content">Filtros</h2>
    <button (click)="close()" class="p-2 hover:bg-base-200 rounded-lg transition-colors cursor-pointer">
      <lucide-icon [img]="xIcon" class="w-5 h-5 text-base-content/60"></lucide-icon>
    </button>
  </div>

  <!-- Filters Content -->
  <div class="flex-1 overflow-y-auto p-4">
    <div class="space-y-4">
      <!-- Products -->
      <div class="border-b border-base-200 pb-4">
        <button (click)="toggleSection('products')"
          class="w-full flex items-center justify-between py-3 hover:text-primary transition-colors">
          <span class="text-base-content">Productos</span>
          @if (isSectionExpanded('products')) {
          <lucide-icon [img]="chevronUpIcon" class="w-4 h-4 text-base-content/40"></lucide-icon>
          } @else {
          <lucide-icon [img]="chevronDownIcon" class="w-4 h-4 text-base-content/40"></lucide-icon>
          }
        </button>
        @if (isSectionExpanded('products')) {
        <div class="mt-2 space-y-2">
          @if (sortedProducts().length === 0) {
          <p class="text-sm text-base-content/50">No hay productos disponibles.</p>
          } @else { @for (product of sortedProducts(); track product.id) {
          <label class="flex items-center gap-3 cursor-pointer group">
            <input type="checkbox" [checked]="isProductSelected(product.id)" (change)="toggleProduct(product.id)"
              class="checkbox checkbox-sm checkbox-primary" />
            <span class="flex-1 text-sm text-base-content/70 group-hover:text-base-content">
              {{ product.name }}
            </span>
          </label>
          } }
        </div>
        }
      </div>
    </div>

    <!-- Clear Filters -->
    <button (click)="clearFilters()"
      class="w-full mt-4 py-2 text-sm text-primary hover:text-primary-focus hover:bg-primary/10 rounded-lg transition-colors cursor-pointer">
      Limpiar filtros
    </button>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-base-200">
    <button (click)="close()" class="btn btn-primary w-full text-white py-3 rounded-lg shadow-md">
      Aplicar filtros
    </button>
  </div>
</div>
