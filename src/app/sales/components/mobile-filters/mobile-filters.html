<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 z-40 lg:hidden cursor-pointer" (click)="close()"></div>

<!-- Modal -->
<div
  class="fixed inset-x-0 bottom-0 bg-white rounded-t-2xl z-50 lg:hidden max-h-[85vh] flex flex-col"
>
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-slate-200">
    <h2 class="text-slate-900">Filtros</h2>
    <button
      (click)="close()"
      class="p-2 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer"
    >
      <lucide-icon [img]="xIcon" class="w-5 h-5 text-slate-600"></lucide-icon>
    </button>
  </div>

  <!-- Filters Content -->
  <div class="flex-1 overflow-y-auto p-4">
    <div class="space-y-4">
      <!-- Categories -->
      <div class="border-b border-slate-200 pb-4">
        <button
          (click)="toggleSection('categories')"
          class="w-full flex items-center justify-between py-3 hover:text-blue-600 transition-colors"
        >
          <span class="text-slate-900">Categorías</span>
          @if (isSectionExpanded('categories')) {
          <lucide-icon [img]="chevronUpIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          } @else {
          <lucide-icon [img]="chevronDownIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          }
        </button>
        @if (isSectionExpanded('categories')) {
        <div class="mt-2 space-y-2">
          @for (category of categories; track category.id) {
          <label class="flex items-center gap-3 cursor-pointer group">
            <input
              type="checkbox"
              [checked]="isCategorySelected(category.id)"
              (change)="toggleCategory(category.id)"
              class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
            />
            <span class="flex-1 text-sm text-slate-700 group-hover:text-slate-900">
              {{ category.label }}
            </span>
            <span class="text-xs text-slate-400">{{ category.count }}</span>
          </label>
          }
        </div>
        }
      </div>

      <!-- Price Range -->
      <div class="border-b border-slate-200 pb-4">
        <button
          (click)="toggleSection('price')"
          class="w-full flex items-center justify-between py-3 hover:text-blue-600 transition-colors"
        >
          <span class="text-slate-900">Rango de Precio</span>
          @if (isSectionExpanded('price')) {
          <lucide-icon [img]="chevronUpIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          } @else {
          <lucide-icon [img]="chevronDownIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          }
        </button>
        @if (isSectionExpanded('price')) {
        <div class="mt-2 space-y-3">
          <div class="flex gap-3">
            <div class="flex-1">
              <label class="text-xs text-slate-600 mb-1 block">Mínimo</label>
              <input
                type="number"
                placeholder="$0"
                [value]="filters().priceRange[0] || ''"
                (input)="setPriceMin($any($event.target).value)"
                class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <div class="flex-1">
              <label class="text-xs text-slate-600 mb-1 block">Máximo</label>
              <input
                type="number"
                placeholder="$1,000,000"
                [value]="filters().priceRange[1] || ''"
                (input)="setPriceMax($any($event.target).value)"
                class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>
        </div>
        }
      </div>

      <!-- Availability -->
      <div class="border-b border-slate-200 pb-4">
        <button
          (click)="toggleSection('availability')"
          class="w-full flex items-center justify-between py-3 hover:text-blue-600 transition-colors"
        >
          <span class="text-slate-900">Disponibilidad</span>
          @if (isSectionExpanded('availability')) {
          <lucide-icon [img]="chevronUpIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          } @else {
          <lucide-icon [img]="chevronDownIcon" class="w-4 h-4 text-slate-400"></lucide-icon>
          }
        </button>
        @if (isSectionExpanded('availability')) {
        <div class="mt-2 space-y-2">
          @for (option of availabilityOptions; track option.value) {
          <label class="flex items-center gap-3 cursor-pointer group">
            <input
              type="radio"
              name="availability-mobile"
              [checked]="filters().availability === option.value"
              (change)="setAvailability($any(option.value))"
              class="w-4 h-4 border-slate-300 text-blue-600 focus:ring-blue-500"
            />
            <span class="text-sm text-slate-700 group-hover:text-slate-900">
              {{ option.label }}
            </span>
          </label>
          }
        </div>
        }
      </div>

      <!-- Discount -->
      <div class="border-b border-slate-200 pb-4">
        <label class="flex items-center gap-3 cursor-pointer group py-3">
          <input
            type="checkbox"
            [checked]="filters().hasDiscount"
            (change)="setHasDiscount($any($event.target).checked)"
            class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
          />
          <div class="flex items-center gap-2">
            <span class="text-sm text-slate-700 group-hover:text-slate-900"> Con descuento </span>
            <span
              class="text-xs px-2 py-0.5 bg-linear-to-r from-red-500 to-orange-500 text-white rounded-full"
            >
              OFERTA
            </span>
          </div>
        </label>
      </div>
    </div>

    <!-- Clear Filters -->
    <button
      (click)="clearFilters()"
      class="w-full mt-4 py-2 text-sm text-blue-600 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition-colors cursor-pointer"
    >
      Limpiar filtros
    </button>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-slate-200">
    <button
      (click)="close()"
      class="w-full bg-linear-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white py-3 rounded-lg transition-all duration-300"
    >
      Aplicar Filtros
    </button>
  </div>
</div>
