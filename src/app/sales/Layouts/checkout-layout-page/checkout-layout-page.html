<div class="min-h-screen bg-slate-50 flex flex-col">
  <nav
    class="h-16 bg-white border-b border-slate-200 flex items-center px-4 lg:px-8 sticky top-0 z-110"
  >
    <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white">
          <svg
            width="20"
            height="20"
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M8 8H12V32H8V8Z" fill="currentColor" />
            <path d="M8 18H28V22H8V18Z" fill="currentColor" />
          </svg>
        </div>
        <span class="font-bold text-slate-900 tracking-tight">Higinex</span>
      </div>

      <button
        (click)="goToCatalog()"
        class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors"
      >
        Cancelar y volver al catálogo
      </button>
    </div>
  </nav>

  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-8">
      <div class="flex items-center">
        <div class="flex flex-col items-center gap-2 flex-1">
          <div
            [class]="getStepClass(1)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500"
          >
            @if (currentStep > 1) { <lucide-icon [img]="checkIcon" class="w-5 h-5"></lucide-icon> }
            @else { 1 }
          </div>
          <span
            class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 1 ? 'text-primary' : 'text-slate-400'"
            >Carrito</span
          >
        </div>

        <div class="w-full h-0.5 mb-6 bg-slate-100 relative">
          <div
            class="absolute inset-0 bg-primary transition-all duration-700"
            [style.width]="currentStep > 1 ? '100%' : '0%'"
          ></div>
        </div>

        <div class="flex flex-col items-center gap-2 flex-1">
          <div
            [class]="getStepClass(2)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500"
          >
            @if (currentStep > 2) { <lucide-icon [img]="checkIcon" class="w-5 h-5"></lucide-icon> }
            @else { 2 }
          </div>
          <span
            class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 2 ? 'text-primary' : 'text-slate-400'"
            >Confirmación</span
          >
        </div>

        <div class="w-full h-0.5 mb-6 bg-slate-100 relative">
          <div
            class="absolute inset-0 bg-primary transition-all duration-700"
            [style.width]="currentStep > 2 ? '100%' : '0%'"
          ></div>
        </div>

        <div class="flex flex-col items-center gap-2 flex-1">
          <div
            [class]="getStepClass(3)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500"
          >
            3
          </div>
          <span
            class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 3 ? 'text-primary' : 'text-slate-400'"
            >Pago</span
          >
        </div>
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-4 lg:p-8 animate-in fade-in duration-500">
    <router-outlet></router-outlet>
  </main>

  <footer class="py-8 border-t border-slate-200 text-center">
    <p class="text-xs text-slate-400 uppercase tracking-widest font-medium">
      Higinex S.A.S — Checkout Seguro
    </p>
  </footer>
</div>
