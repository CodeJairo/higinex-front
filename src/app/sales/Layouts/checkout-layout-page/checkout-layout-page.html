<demo-banner />
<div class="min-h-screen bg-base-200 flex flex-col">
  <nav class="h-20 bg-base-100 border-b border-base-200 flex items-center px-4 lg:px-8 sticky top-0 z-110 shadow-sm">
    <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
      <div class="flex items-center gap-3.5">
        <div
          class="w-12 h-12 bg-base-100 flex items-center justify-center shrink-0 rounded-2xl shadow-sm border border-base-200">
          <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-cover p-1" />
        </div>
        <div class="flex flex-col items-start min-w-0">
          <span class="text-xl font-black text-base-content leading-none tracking-tighter uppercase">Higinex</span>
          <span class="text-[10px] font-bold text-primary uppercase tracking-[0.15em] mt-1 opacity-80">Checkout
            Seguro</span>
        </div>
      </div>

      <button (click)="goToCatalog()"
        class="text-sm font-medium text-base-content/60 hover:text-base-content transition-colors">
        Cancelar y volver al catálogo
      </button>
    </div>
  </nav>

  <div class="bg-base-100 border-b border-base-200 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-8">
      <div class="flex items-center">
        <div class="flex flex-col items-center gap-2 flex-1">
          <div [class]="getStepClass(1)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500">
            @if (currentStep > 1) { <lucide-icon [img]="checkIcon" class="w-5 h-5"></lucide-icon> }
            @else { 1 }
          </div>
          <span class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 1 ? 'text-primary' : 'text-base-content/40'">Carrito</span>
        </div>

        <div class="w-full h-0.5 mb-6 bg-base-200 relative">
          <div class="absolute inset-0 bg-primary transition-all duration-700"
            [style.width]="currentStep > 1 ? '100%' : '0%'"></div>
        </div>

        <div class="flex flex-col items-center gap-2 flex-1">
          <div [class]="getStepClass(2)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500">
            @if (currentStep > 2) { <lucide-icon [img]="checkIcon" class="w-5 h-5"></lucide-icon> }
            @else { 2 }
          </div>
          <span class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 2 ? 'text-primary' : 'text-base-content/40'">Confirmación</span>
        </div>

        <div class="w-full h-0.5 mb-6 bg-base-200 relative">
          <div class="absolute inset-0 bg-primary transition-all duration-700"
            [style.width]="currentStep > 2 ? '100%' : '0%'"></div>
        </div>

        <div class="flex flex-col items-center gap-2 flex-1">
          <div [class]="getStepClass(3)"
            class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold transition-all duration-500">
            3
          </div>
          <span class="text-[11px] font-bold uppercase tracking-wider"
            [class]="currentStep >= 3 ? 'text-primary' : 'text-base-content/40'">Pago</span>
        </div>
      </div>
    </div>
  </div>

  <main class="flex-1 max-w-7xl mx-auto w-full p-4 lg:p-8 animate-in fade-in duration-500">
    <router-outlet></router-outlet>
  </main>

  <footer class="py-8 border-t border-base-200 text-center">
    <p class="text-xs text-base-content/40 uppercase tracking-widest font-medium">
      Higinex S.A.S — Checkout Seguro
    </p>
  </footer>
</div>
