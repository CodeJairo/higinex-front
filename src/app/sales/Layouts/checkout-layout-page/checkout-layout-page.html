<demo-banner />
<div class="min-h-screen ios-canvas flex flex-col relative overflow-x-hidden">
  <!-- Dynamic Ambient Aurora Glow Background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10" aria-hidden="true">
    <div class="ios-ambient-orb ios-ambient-orb-1"></div>
    <div class="ios-ambient-orb ios-ambient-orb-2"></div>
    <div class="ios-ambient-orb ios-ambient-orb-3"></div>
  </div>

  <!-- Floating iOS Minimalist Checkout Navbar -->
  <header class="p-2 sm:p-3 sticky top-0 z-110 pointer-events-none">
    <nav
      class="max-w-[1560px] 3xl:max-w-[1680px] mx-auto rounded-full sm:rounded-[24px] ios-glass pointer-events-auto px-4 sm:px-6 h-14 sm:h-15 flex items-center justify-between shadow-xs transition-all"
    >
      <div class="flex items-center gap-2.5 sm:gap-3">
        <div
          class="w-8 h-8 sm:w-9 sm:h-9 bg-white/90 rounded-xl sm:rounded-2xl border border-white/80 shadow-xs flex items-center justify-center shrink-0"
        >
          <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-contain p-1" />
        </div>
        <div class="flex flex-col items-start leading-none">
          <div class="flex items-center gap-1.5">
            <span class="text-sm sm:text-base font-bold text-base-content tracking-tight">Higinex</span>
            <span class="bg-primary/10 text-primary border border-primary/20 text-[9px] font-bold px-2 py-0.5 rounded-full tracking-wider">
              B2B
            </span>
          </div>
          <span class="text-[9px] font-bold text-primary/80 uppercase tracking-widest mt-0.5">
            Checkout Seguro
          </span>
        </div>
      </div>

      <button
        type="button"
        (click)="goToCatalog()"
        class="h-8.5 px-3.5 rounded-full bg-black/[0.03] hover:bg-black/[0.06] border border-black/[0.05] text-xs font-semibold text-base-content/70 hover:text-primary transition-all flex items-center gap-1.5 cursor-pointer"
      >
        <lucide-icon [img]="arrowLeftIcon" class="w-3.5 h-3.5"></lucide-icon>
        <span class="hidden xs:inline">Cancelar y volver al catálogo</span>
        <span class="xs:hidden">Catálogo</span>
      </button>
    </nav>
  </header>

  <!-- iOS Floating Stepper Pill -->
  <div class="max-w-3xl 2xl:max-w-4xl mx-auto w-full px-4 pt-1 pb-3">
    <div
      class="ios-glass-card rounded-2xl sm:rounded-full px-4 sm:px-6 py-2.5 sm:py-3 border border-white/80 shadow-xs flex items-center justify-between"
    >
      <!-- Step 1: Carrito -->
      <div class="flex items-center gap-2">
        <div
          [class]="getStepClass(1)"
          class="w-6.5 h-6.5 sm:w-7 sm:h-7 rounded-lg sm:rounded-xl flex items-center justify-center text-xs font-bold transition-all duration-300 shrink-0"
        >
          @if (currentStep > 1) {
            <lucide-icon [img]="checkIcon" class="w-3.5 h-3.5 stroke-[3]"></lucide-icon>
          } @else {
            1
          }
        </div>
        <span
          class="text-[11px] font-bold uppercase tracking-wider"
          [class.text-primary]="currentStep >= 1"
          [class.text-base-content/40]="currentStep < 1"
        >
          Bolsa
        </span>
      </div>

      <!-- Connector 1 -->
      <div class="flex-1 mx-2 sm:mx-4 h-0.5 bg-base-300/60 rounded-full relative overflow-hidden">
        <div
          class="absolute inset-y-0 left-0 bg-primary transition-all duration-500 rounded-full"
          [style.width]="currentStep > 1 ? '100%' : '0%'"
        ></div>
      </div>

      <!-- Step 2: Confirmación -->
      <div class="flex items-center gap-2">
        <div
          [class]="getStepClass(2)"
          class="w-6.5 h-6.5 sm:w-7 sm:h-7 rounded-lg sm:rounded-xl flex items-center justify-center text-xs font-bold transition-all duration-300 shrink-0"
        >
          @if (currentStep > 2) {
            <lucide-icon [img]="checkIcon" class="w-3.5 h-3.5 stroke-[3]"></lucide-icon>
          } @else {
            2
          }
        </div>
        <span
          class="text-[11px] font-bold uppercase tracking-wider"
          [class.text-primary]="currentStep >= 2"
          [class.text-base-content/40]="currentStep < 2"
        >
          Confirmación
        </span>
      </div>

      <!-- Connector 2 -->
      <div class="flex-1 mx-2 sm:mx-4 h-0.5 bg-base-300/60 rounded-full relative overflow-hidden">
        <div
          class="absolute inset-y-0 left-0 bg-primary transition-all duration-500 rounded-full"
          [style.width]="currentStep > 2 ? '100%' : '0%'"
        ></div>
      </div>

      <!-- Step 3: Pedido -->
      <div class="flex items-center gap-2">
        <div
          [class]="getStepClass(3)"
          class="w-6.5 h-6.5 sm:w-7 sm:h-7 rounded-lg sm:rounded-xl flex items-center justify-center text-xs font-bold transition-all duration-300 shrink-0"
        >
          3
        </div>
        <span
          class="text-[11px] font-bold uppercase tracking-wider"
          [class.text-primary]="currentStep >= 3"
          [class.text-base-content/40]="currentStep < 3"
        >
          Pedido
        </span>
      </div>
    </div>
  </div>

  <!-- Content Outlet -->
  <main class="flex-1 max-w-[1560px] 3xl:max-w-[1680px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-3 sm:py-5 animate-in fade-in duration-300">
    <router-outlet></router-outlet>
  </main>

  <!-- Minimalist Clean Footer -->
  <footer class="py-5 border-t border-black/[0.06] bg-white/50 backdrop-blur-sm text-center mt-auto">
    <div class="max-w-[1560px] 3xl:max-w-[1680px] mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2.5 text-[11px] text-base-content/60">
      <span class="font-medium">Higinex S.A.S — Suministros Institucionales B2B</span>
      <div class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1">
        <span>CL 9 SUR 79C 115, MEDELLÍN</span>
        <span class="hidden sm:inline">&bull;</span>
        <a href="tel:+573042729943" class="hover:text-primary font-bold text-base-content/80 transition-colors">+57 304 272 9943</a>
      </div>
    </div>
  </footer>
</div>
