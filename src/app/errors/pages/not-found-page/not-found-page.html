<div class="min-h-screen bg-linear-to-br from-base-200 via-base-300 to-base-200 flex items-center justify-center p-4">
  <div class="max-w-2xl w-full">
    <!-- Logo pequeño arriba -->
    <div class="flex justify-center mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-base-100 flex items-center justify-center rounded-lg shadow-sm text-primary">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" fill="currentColor" class="text-base-100" />
            <path d="M8 8H12V32H8V8Z" fill="currentColor" class="text-primary" />
            <path d="M16 8H20V32H16V8Z" fill="currentColor" class="text-primary" />
            <path d="M24 8H28V32H24V8Z" fill="currentColor" class="text-primary" />
            <path d="M8 18H28V22H8V18Z" fill="currentColor" class="text-primary" />
            <circle cx="32" cy="12" r="3" fill="currentColor" class="text-success" />
            <circle cx="32" cy="28" r="3" fill="currentColor" class="text-success" />
          </svg>
        </div>
        <span class="text-base-content font-bold">Higinex</span>
      </div>
    </div>

    <!-- Main Content -->
    <div class="bg-base-100 rounded-2xl shadow-xl p-8 md:p-12 text-center">
      <!-- Animated 404 illustration -->
      <div class="mb-8">
        <div class="relative inline-block">
          <!-- 404 Number -->
          <div class="flex items-center justify-center gap-4">
            <span class="text-primary opacity-20" style="font-size: 8rem; line-height: 1">4</span>

            <!-- Animated product box in the middle -->
            <div class="relative">
              <div
                class="w-24 h-24 bg-linear-to-br from-primary to-primary-focus rounded-2xl flex items-center justify-center transform -rotate-12 animate-pulse">
                <lucide-icon [img]="packageIcon" class="w-12 h-12 text-primary-content"></lucide-icon>
              </div>
              <!-- Search icon floating -->
              <div
                class="absolute -top-2 -right-2 w-8 h-8 bg-neutral rounded-full flex items-center justify-center animate-bounce">
                <lucide-icon [img]="searchIcon" class="w-4 h-4 text-neutral-content"></lucide-icon>
              </div>
            </div>

            <span class="text-primary opacity-20" style="font-size: 8rem; line-height: 1">4</span>
          </div>
        </div>
      </div>

      <!-- Title -->
      <h1 class="text-base-content font-bold text-2xl mb-4">Página no encontrada</h1>

      <!-- Description -->
      <p class="text-base-content/60 mb-8 max-w-md mx-auto">
        Lo sentimos, la página que estás buscando no existe o ha sido movida. Puede que el enlace
        esté roto o que hayas escrito mal la dirección.
      </p>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-3 justify-center mb-8">
        <button (click)="goToCatalog()"
          class="px-6 py-3 btn btn-primary rounded-lg flex items-center justify-center gap-2 cursor-pointer text-primary-content">
          <lucide-icon [img]="homeIcon" class="w-5 h-5"></lucide-icon>
          Volver al Catálogo
        </button>

        <button (click)="goBack()"
          class="px-6 py-3 btn btn-ghost bg-base-200 text-base-content rounded-lg hover:bg-base-300 transition-colors flex items-center justify-center gap-2 cursor-pointer">
          <lucide-icon [img]="arrowLeftIcon" class="w-5 h-5"></lucide-icon>
          Ir Atrás
        </button>
      </div>

      <!-- Helpful suggestions -->
      <div class="border-t border-base-200 pt-8">
        <p class="text-sm text-base-content/60 mb-4">Páginas que podrían interesarte:</p>
        <div class="flex flex-wrap gap-2 justify-center">
          <button (click)="goToCatalog()"
            class="px-4 py-2 text-sm bg-base-200 text-base-content/80 rounded-lg hover:bg-base-300 transition-colors cursor-pointer">
            🏠 Inicio
          </button>
          <button (click)="goToCatalog()"
            class="px-4 py-2 text-sm bg-base-200 text-base-content/80 rounded-lg hover:bg-base-300 transition-colors cursor-pointer">
            📦 Catálogo de Productos
          </button>
          <button
            class="px-4 py-2 text-sm bg-base-200 text-base-content/80 rounded-lg hover:bg-base-300 transition-colors cursor-pointer">
            📋 Mis Pedidos
          </button>
          <button (click)="goToDashboard()"
            class="px-4 py-2 text-sm bg-base-200 text-base-content/80 rounded-lg hover:bg-base-300 transition-colors cursor-pointer">
            💬 Ayuda y Soporte
          </button>
        </div>
      </div>
    </div>

    <!-- Footer info -->
    <div class="text-center mt-6">
      <p class="text-sm text-base-content/60">
        ¿Necesitas ayuda? Contáctanos en
        <a href="mailto:soporte&#64;higinex.com" class="text-primary hover:underline">
          soporte&#64;higinex.com
        </a>
      </p>
    </div>
  </div>
</div>
