@if (isDemoMode()) {
<div class="bg-warning text-warning-content px-4 py-2">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <lucide-icon [img]="warningIcon" class="w-5 h-5 shrink-0"></lucide-icon>
      <span class="text-sm font-medium">
        <strong>Modo Demostración Activo</strong>
        <span class="hidden sm:inline"> — Los cambios no se guardarán.</span>
        @if (demoEmail()) {
          <span class="hidden md:inline"> Notificaciones enviadas a: <strong>{{ demoEmail() }}</strong></span>
        }
      </span>
    </div>
    <button (click)="exitDemo()"
      class="btn btn-sm btn-ghost text-warning-content hover:bg-warning-content/20 gap-1">
      <lucide-icon [img]="logoutIcon" class="w-4 h-4"></lucide-icon>
      <span>Salir de Demo</span>
    </button>
  </div>
</div>
}
