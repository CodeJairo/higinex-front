@if (isDemoMode()) {
  <!-- Glassmorphism Floating Pill - Responsive -->
  <div
    class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-100 px-3 sm:px-5 py-2 sm:py-3 rounded-full bg-base-100/70 backdrop-blur-xl border border-base-200/50 shadow-[0_8px_32px_rgba(0,0,0,0.12)] flex items-center gap-2 sm:gap-4 animate-in fade-in slide-in-from-bottom-4 duration-500"
  >
    <!-- Pulse Indicator -->
    <div class="relative flex items-center justify-center">
      <span
        class="absolute w-2.5 sm:w-3 h-2.5 sm:h-3 rounded-full bg-violet-500/40 animate-ping"
      ></span>
      <span
        class="relative w-2 sm:w-2.5 h-2 sm:h-2.5 rounded-full bg-violet-500 shadow-[0_0_8px_var(--color-violet-500)]"
      ></span>
    </div>

    <!-- Text - Hidden on very small screens, abbreviated on small -->
    <span
      class="text-[10px] sm:text-xs font-bold text-base-content/80 tracking-wide whitespace-nowrap"
    >
      <span class="hidden xs:inline">Estás en </span
      ><span class="text-violet-500 font-black">Demo</span>
    </span>

    <!-- Divider -->
    <div class="w-px h-3 sm:h-4 bg-base-300"></div>

    <!-- Exit Button -->
    <button
      (click)="exitDemo()"
      title="Salir del modo demo"
      aria-label="Salir del modo demo"
      class="flex items-center gap-1 sm:gap-1.5 text-[10px] sm:text-xs font-bold text-base-content/60 hover:text-error transition-colors group"
    >
      <lucide-icon
        [img]="logoutIcon"
        class="w-3 sm:w-3.5 h-3 sm:h-3.5 group-hover:scale-110 transition-transform"
      ></lucide-icon>
      <span class="hidden sm:inline">Salir</span>
    </button>
  </div>
}
