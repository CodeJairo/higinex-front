<aside class="w-72 min-h-screen bg-base-100 border-r border-base-200 flex flex-col transition-all duration-300">

    <div class="flex-1 py-8 px-4 overflow-y-auto">

        <ul class="menu w-full gap-2 p-0 text-sm font-medium text-base-content/80">

            <li class="menu-title px-4 text-xs font-bold uppercase tracking-widest text-primary/70 mb-1">
                Gestión de Inventario
            </li>

            <li>
                <a routerLink="/admin/inventory" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="rounded-lg py-3 hover:bg-base-200 hover:text-base-content transition-all duration-200">
                    <lucide-icon [img]="dashboardIcon" class="w-5 h-5 opacity-70"></lucide-icon>
                    Resumen
                </a>
            </li>
            <li>
                <a routerLink="/admin/inventory/movements"
                    routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="rounded-lg py-3 hover:bg-base-200 hover:text-base-content transition-all duration-200">
                    <lucide-icon [img]="movementsIcon" class="w-5 h-5 opacity-70"></lucide-icon>
                    Movimientos
                </a>
            </li>

            <div class="h-px bg-base-200/60 my-4 mx-2"></div>

            <li class="menu-title px-4 text-xs font-bold uppercase tracking-widest text-primary/70 mb-1">
                Catálogo
            </li>

            <li>
                <a routerLink="/admin/inventory/products"
                    routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="rounded-lg py-3 hover:bg-base-200 hover:text-base-content transition-all duration-200">
                    <lucide-icon [img]="productsIcon" class="w-5 h-5 opacity-70"></lucide-icon>
                    Productos
                </a>
            </li>
        </ul>

    </div>

    <div class="p-4 border-t border-base-200 bg-base-100">
        <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-base-200/40 border border-base-200/50">
            <div class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-success"></span>
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] uppercase font-bold text-base-content/50 leading-tight">Estado</span>
                <span class="text-xs font-bold text-base-content leading-tight">Sistema Operativo</span>
            </div>
        </div>
    </div>
</aside>
