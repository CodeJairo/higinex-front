<!-- Mobile Header -->
<header
  class="md:hidden sticky top-0 z-40 w-full bg-base-100/80 backdrop-blur border-b border-base-200 px-4 h-14 flex items-center justify-between">
  <!-- Brand -->
  <a routerLink="/admin/dashboard" class="flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center shrink-0">
      <img src="/logo.svg" alt="Higinex" class="w-full h-full object-cover p-1" />
    </div>
    <span class="font-bold text-lg tracking-tight text-base-content">Higinex</span>
  </a>

  <!-- Mobile Actions -->
  <div class="flex items-center gap-2">
    <a routerLink="/sales/catalog" class="btn btn-sm btn-ghost btn-circle text-primary tooltip tooltip-bottom"
      data-tip="Ir al Catálogo">
      <lucide-icon [img]="shoppingBagIcon" class="w-5 h-5"></lucide-icon>
    </a>
  </div>
</header>

<header
  class="hidden md:block sticky top-0 z-50 w-full border-b border-base-200 bg-base-100/80 backdrop-blur supports-[backdrop-filter]:bg-base-100/60">
  <div class="container mx-auto max-w-7xl px-4 sm:px-6">
    <div class="navbar min-h-[4rem] px-0 gap-4">

      <div class="navbar-start w-auto mr-4">
        <a routerLink="/admin/dashboard" class="flex items-center gap-3 group">
          <div
            class="relative w-10 h-10 bg-base-100 flex items-center justify-center shrink-0 rounded-xl shadow-xs border border-base-200 group-hover:shadow-sm transition-all duration-200">
            <img src="/logo.svg" alt="Higinex Logo" class="w-full h-full object-cover p-1" />
          </div>
          <div class="flex flex-col leading-none">
            <span class="font-bold text-lg text-base-content tracking-tight">Higinex</span>
            <span class="text-[10px] font-bold text-primary tracking-widest uppercase opacity-80">Admin</span>
          </div>
        </a>
      </div>

      <div class="navbar-center flex-1">
        <ul class="menu menu-horizontal px-1 gap-1">
          <li>
            <a routerLink="/admin/dashboard" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              [routerLinkActiveOptions]="{exact: true}"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Inicio
            </a>
          </li>
          <li>
            <a routerLink="/admin/inventory" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Inventario
            </a>
          </li>
          <li>
            <a routerLink="/admin/orders" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Pedidos
            </a>
          </li>
          <li>
            <a routerLink="/admin/customers" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Clientes
            </a>
          </li>
          <li>
            <a routerLink="/admin/contracts" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Contratos
            </a>
          </li>
          <li>
            <a routerLink="/admin/billing" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Facturación
            </a>
          </li>
          <li>
            <a routerLink="/admin/users" routerLinkActive="bg-base-200 text-primary font-bold shadow-sm"
              class="rounded-lg text-sm font-medium text-base-content/70 hover:bg-base-200 hover:text-base-content transition-all h-9 min-h-0 px-4">
              Usuarios
            </a>
          </li>
        </ul>
      </div>

      <div class="navbar-end w-auto">
        <a routerLink="/sales/catalog"
          class="btn btn-ghost btn-sm gap-2 font-medium text-base-content/70 hover:text-primary hover:bg-primary/10 transition-all">
          <lucide-icon [img]="shoppingBagIcon" class="w-4 h-4"></lucide-icon>
          <span class="hidden sm:inline">Ir al Catálogo</span>
        </a>
      </div>
    </div>
  </div>
</header>

<div class="dock hidden not-md:flex bg-base-100/90 backdrop-blur border-t border-base-200 pb-safe z-50">
  <button routerLink="/admin/dashboard" class="text-base-content/60 hover:text-base-content transition-colors"
    routerLinkActive="dock-active text-primary">
    <lucide-icon [img]="houseIcon" class="w-6 h-6"></lucide-icon>
    <span class="dock-label text-[10px] font-medium mt-1">Inicio</span>
  </button>

  <button routerLink="/admin/inventory" class="text-base-content/60 hover:text-base-content transition-colors"
    routerLinkActive="dock-active text-success">
    <lucide-icon [img]="warehouseIcon" class="w-6 h-6"></lucide-icon>
    <span class="dock-label text-[10px] font-medium mt-1">Inventario</span>
  </button>

  <button routerLink="/admin/orders" class="text-base-content/60 hover:text-base-content transition-colors"
    routerLinkActive="dock-active text-orange-500">
    <lucide-icon [img]="packageIcon" class="w-6 h-6"></lucide-icon>
    <span class="dock-label text-[10px] font-medium mt-1">Pedidos</span>
  </button>

  <button (click)="mobileMenu.showModal()" class="text-base-content/60 hover:text-base-content transition-colors">
    <lucide-icon [img]="menuIcon" class="w-6 h-6"></lucide-icon>
    <span class="dock-label text-[10px] font-medium mt-1">Más</span>
  </button>
</div>

<dialog #mobileMenu class="modal modal-bottom sm:modal-middle">
  <div class="modal-box p-4 pt-6">
    <h3 class="font-bold text-lg mb-4 px-2">Menú Principal</h3>

    <div class="grid grid-cols-2 gap-3">
      <a routerLink="/sales/catalog" (click)="mobileMenu.close()"
        class="col-span-2 flex flex-row items-center justify-center p-4 bg-base-200 rounded-xl gap-3 active:scale-95 transition-transform border border-primary/20">
        <div class="p-2 bg-primary/10 rounded-full text-primary">
          <lucide-icon [img]="shoppingBagIcon" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="font-bold text-sm text-primary">Ir al Catálogo</span>
      </a>
      <a routerLink="/admin/users" (click)="mobileMenu.close()"
        class="flex flex-col items-center justify-center p-4 bg-base-200 rounded-xl gap-2 active:scale-95 transition-transform">
        <div class="p-3 bg-info/10 rounded-full text-info">
          <lucide-icon [img]="usersIcon" class="w-6 h-6"></lucide-icon>
        </div>
        <span class="font-medium text-sm">Usuarios</span>
      </a>

      <a routerLink="/admin/customers" (click)="mobileMenu.close()"
        class="flex flex-col items-center justify-center p-4 bg-base-200 rounded-xl gap-2 active:scale-95 transition-transform">
        <div class="p-3 bg-secondary/10 rounded-full text-secondary">
          <lucide-icon [img]="buildingIcon" class="w-6 h-6"></lucide-icon>
        </div>
        <span class="font-medium text-sm">Clientes</span>
      </a>

      <a routerLink="/admin/contracts" (click)="mobileMenu.close()"
        class="flex flex-col items-center justify-center p-4 bg-base-200 rounded-xl gap-2 active:scale-95 transition-transform">
        <div class="p-3 bg-warning/10 rounded-full text-warning">
          <lucide-icon [img]="dolarSignIcon" class="w-6 h-6"></lucide-icon>
        </div>
        <span class="font-medium text-sm">Contratos</span>
      </a>

      <a routerLink="/admin/billing" (click)="mobileMenu.close()"
        class="flex flex-col items-center justify-center p-4 bg-base-200 rounded-xl gap-2 active:scale-95 transition-transform">
        <div class="p-3 bg-error/10 rounded-full text-error">
          <lucide-icon [img]="fileTextIcon" class="w-6 h-6"></lucide-icon>
        </div>
        <span class="font-medium text-sm">Facturación</span>
      </a>
    </div>

    <div class="modal-action">
      <form method="dialog" class="w-full">
        <button class="btn btn-block">Cerrar</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
