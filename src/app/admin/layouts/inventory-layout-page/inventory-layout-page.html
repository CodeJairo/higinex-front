<div class="drawer lg:drawer-open min-h-screen bg-base-100 font-sans">
  <input id="inventory-drawer" type="checkbox" class="drawer-toggle" />

  <!-- CONTENIDO PRINCIPAL -->
  <div class="drawer-content flex flex-col bg-base-200/60 min-h-screen">
    <!-- Top bar solo en móvil -->
    <div
      class="w-full navbar bg-base-100/80 backdrop-blur-md border-b border-base-200 sticky top-0 z-30 lg:hidden px-4">
      <div class="flex-none">
        <label for="inventory-drawer" class="btn btn-ghost btn-circle text-base-content"
          aria-label="Abrir menú de inventario">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </label>
      </div>
      <div class="flex-1 px-2 mx-2">
        <span class="font-bold text-lg text-base-content tracking-tight">Inventario</span>
      </div>
    </div>

    <!-- Main content container -->
    <main class="flex-1 w-full max-w-[1920px] mx-auto overflow-x-hidden">
      <router-outlet />
    </main>
  </div>

  <!-- SIDEBAR -->
  <div class="drawer-side z-40">
    <label for="inventory-drawer" class="drawer-overlay bg-black/20 backdrop-blur-sm"></label>

    <aside
      class="w-72 min-h-screen bg-base-100 border-r border-base-200 flex flex-col transition-transform duration-300">
      <!-- Header / Branding -->
      <div class="p-6 border-b border-base-100">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-boxes">
              <path
                d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.74l5 3.03a2 2 0 0 0 2 0l5-3.03a2 2 0 0 0 .97-1.74V14.63a2 2 0 0 0-.97-1.71l-5-3.03a2 2 0 0 0-2 0Z" />
              <path d="m7 16.5-4.74-2.85" />
              <path d="m7 16.5 5-3.03" />
              <path d="M17 16.5 12 13.47" />
              <path d="M22 6.5 17 3.47" />
              <path d="m2 6.5 5 3.03" />
              <path d="m17 16.5-5-3.03" />
              <path d="m12 6.5 5 3.03" />
              <path d="m7 6.5-5-3.03" />
              <path d="M22 6.5V14.63a2 2 0 0 1-.97 1.74l-5 3.03" />
              <path
                d="M22 6.5V3.47a2 2 0 0 0-.97-1.74l-5 3.03a2 2 0 0 0-2 0l-5-3.03a2 2 0 0 0-.97 1.74V6.5a2 2 0 0 0 .97 1.74l5 3.03a2 2 0 0 0 2 0z" />
            </svg>
          </div>
          <span class="font-black text-xl tracking-tight text-base-content">Higinex<span
              class="text-primary">.</span></span>
        </div>
        <p class="text-xs font-semibold text-base-content/40 uppercase tracking-widest pl-1">Gestión de Logística</p>
      </div>

      <!-- Menu -->
      <ul class="menu flex-1 gap-1 p-4 text-sm font-medium text-base-content/70">
        <!-- Bloque Inventario -->
        <li class="menu-title px-4 py-2 text-xs font-bold uppercase tracking-widest text-base-content/40 mt-2">
          Inventario General
        </li>
        <li>
          <a routerLink="/admin/inventory" routerLinkActive="bg-base-200 text-base-content font-bold active-menu-item"
            [routerLinkActiveOptions]="{ exact: true }" class="rounded-lg group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-layout-dashboard group-[.active-menu-item]:text-primary">
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            Resumen
          </a>
        </li>
        <li>
          <a routerLink="/admin/inventory/movements"
            routerLinkActive="bg-base-200 text-base-content font-bold active-menu-item"
            [routerLinkActiveOptions]="{ exact: true }" class="rounded-lg group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-arrow-left-right group-[.active-menu-item]:text-primary">
              <path d="M8 3 4 7l4 4" />
              <path d="M4 7h16" />
              <path d="m16 21 4-4-4-4" />
              <path d="M20 17H4" />
            </svg>
            Movimientos
          </a>
        </li>

        <div class="divider my-2 h-px bg-base-200"></div>

        <!-- Bloque Catálogo -->
        <li class="menu-title px-4 py-2 text-xs font-bold uppercase tracking-widest text-base-content/40">
          Catálogo
        </li>
        <li>
          <a routerLink="/admin/inventory/products"
            routerLinkActive="bg-base-200 text-base-content font-bold active-menu-item"
            [routerLinkActiveOptions]="{ exact: true }" class="rounded-lg group">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-tag group-[.active-menu-item]:text-primary">
              <path
                d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l5 5a2 2 0 0 0 2.828 0l7.172-7.172a2 2 0 0 0 0-2.828l-5-5z" />
              <circle cx="7.5" cy="7.5" r=".5" fill="currentColor" />
            </svg>
            Productos
          </a>
        </li>

      </ul>

      <!-- Footer / espacio inferior -->
      <div class="p-6 border-t border-base-200">
        <div class="rounded-xl bg-base-200/50 p-4">
          <p class="text-[10px] font-bold text-base-content/60 uppercase tracking-wider mb-2">Sistema</p>
          <div class="flex items-center gap-2 text-xs text-base-content/80 font-medium">
            <div class="w-2 h-2 rounded-full bg-success"></div>
            <span>Operativo</span>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
