<div class="drawer lg:drawer-open min-h-screen">
  <input id="inventory-drawer" type="checkbox" class="drawer-toggle" />

  <!-- CONTENIDO PRINCIPAL -->
  <div class="drawer-content flex flex-col">
    <!-- Top bar solo en móvil -->
    <div class="w-full navbar bg-base-100 border-b border-slate-200 lg:hidden">
      <div class="flex-none">
        <label
          for="inventory-drawer"
          class="btn btn-ghost btn-square"
          aria-label="Abrir menú de inventario"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </label>
      </div>
      <div class="flex-1">
        <span class="font-semibold text-slate-800">Manejo de Inventario</span>
      </div>
    </div>

    <!-- Main content -->
    <main class="flex-1">
      <router-outlet />
    </main>
  </div>

  <!-- SIDEBAR -->
  <div class="drawer-side z-100">
    <label for="inventory-drawer" class="drawer-overlay"></label>

    <aside class="w-64 min-h-screen bg-base-100 border-r border-slate-200 p-4 flex flex-col">
      <!-- Header / Branding -->
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-slate-800">Manejo de Inventario</h2>
        <p class="text-sm text-slate-500">Gestión de existencias y productos</p>
      </div>

      <!-- Menu -->
      <ul class="menu flex-1 gap-3 text-sm">
        <!-- Bloque Inventario -->
        <li>
          <h3 class="menu-title text-xs uppercase tracking-wide text-slate-400">Inventario</h3>
          <ul class="mt-1 space-y-1">
            <li>
              <a
                routerLink="/admin/inventory"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Resumen de inventario
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/inventory/movements"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Movimientos de stock
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/inventory/alerts"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Alertas de stock
              </a>
            </li>
          </ul>
        </li>

        <!-- Divider visual opcional -->
        <li><div class="divider my-1 pointer-events-none"></div></li>

        <!-- Bloque Productos -->
        <li>
          <h3 class="menu-title text-xs uppercase tracking-wide text-slate-400">Productos</h3>
          <ul class="mt-1 space-y-1">
            <li>
              <a
                routerLink="/admin/inventory/products"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Lista de productos
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/inventory/create-product"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Crear producto
              </a>
            </li>
            <li>
              <a
                routerLink="/admin/inventory/products/categories"
                routerLinkActive="bg-base-200"
                [routerLinkActiveOptions]="{ exact: true }"
                class="rounded-lg"
              >
                Categorías y agrupaciones
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Footer / espacio inferior -->
      <div class="mt-6 text-xs text-slate-500">Administración del sistema</div>
    </aside>
  </div>
</div>
