<nav class="sticky top-0 z-40 w-full bg-base-100/80 backdrop-blur-md border-b border-base-200">
  <div class="max-w-7xl mx-auto navbar h-20 px-4 lg:px-8">
    <div class="navbar-start">
      <button (click)="goToHome()" class="group flex items-center gap-3.5 hover:opacity-90 transition-all duration-300">
        <div
          class="w-12 h-12 bg-base-100 flex items-center justify-center rounded-2xl border border-base-200 shadow-sm group-hover:shadow-md group-hover:-translate-y-0.5 transition-all duration-300">
          <img src="/logo.svg" alt="Higinex" class="w-full h-full object-cover p-1" />
        </div>

        <div class="flex flex-col items-start min-w-0">
          <span class="text-xl font-black text-base-content leading-none tracking-tighter uppercase">Higinex</span>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="w-1 h-1 rounded-full bg-primary"></span>
            <span class="text-[10px] font-bold text-base-content/60 uppercase tracking-[0.15em]">
              Panel Cliente
            </span>
          </div>
        </div>
      </button>
    </div>

    <div class="navbar-center hidden md:flex">
      <div
        class="flex items-center gap-2 px-3 py-1.5 bg-base-200/50 rounded-full border border-base-300 backdrop-blur-sm">
        <div class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-success"></span>
        </div>
        <span class="text-[10px] font-bold text-base-content/60 uppercase tracking-widest">
          Conexión Segura
        </span>
      </div>
    </div>

    <div class="navbar-end gap-2">
      <button
        class="btn btn-ghost btn-circle btn-sm text-base-content/40 hover:text-base-content hover:bg-base-200 transition-all"
        title="Centro de Ayuda">
        <lucide-icon [img]="helpIcon" class="w-5 h-5 stroke-[1.5]"></lucide-icon>
      </button>

      <div class="hidden sm:block w-px h-6 bg-base-300 mx-1"></div>

      <div class="pl-1">
        @if (hasUser()) { @if (isAdmin()) {
        <sales-admin-user-menu [userName]="userDisplayName()" [userDetail]="userDisplayDetail()"
          (logout)="logout()"></sales-admin-user-menu>
        } @else {
        <sales-customer-user-menu [userName]="userDisplayName()" [userDetail]="userDisplayDetail()"
          (logout)="logout()"></sales-customer-user-menu>
        } }
      </div>
    </div>
  </div>
</nav>
