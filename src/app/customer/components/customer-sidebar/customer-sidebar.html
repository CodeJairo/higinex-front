<!-- Desktop Floating Sidebar -->
<aside class="hidden md:flex flex-col w-72 shrink-0 gap-3">
  <!-- Prominent "Ir al Catálogo" Card -->
  <a
    routerLink="/sales/catalog"
    class="flex items-center gap-3 p-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-md shadow-emerald-900/10 hover:shadow-lg hover:scale-[1.02] transition-all group cursor-pointer border border-emerald-500/30"
  >
    <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center shrink-0">
      <lucide-icon [img]="shoppingBagIcon" class="w-5 h-5 text-white"></lucide-icon>
    </div>
    <div class="flex flex-col min-w-0">
      <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-100">Tienda B2B</span>
      <span class="text-sm font-extrabold text-white leading-tight flex items-center gap-1.5">
        Ir al Catálogo
        <lucide-icon [img]="arrowRightIcon" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></lucide-icon>
      </span>
    </div>
  </a>

  <!-- Navigation Menu Island -->
  <div class="ios-glass-card rounded-3xl p-3 border border-white/80 shadow-xs space-y-1">
    <div class="px-3 pt-2 pb-1">
      <h2 class="text-[10px] font-bold uppercase text-base-content/40 tracking-widest">Panel del Cliente</h2>
    </div>

    <nav>
      <ul class="space-y-1">
        <li *ngFor="let item of navItems">
          <a
            [routerLink]="item.disabled ? null : item.route"
            [attr.aria-disabled]="item.disabled"
            [class.opacity-40]="item.disabled"
            [class.pointer-events-none]="item.disabled"
            routerLinkActive="bg-primary/10 text-primary font-bold shadow-xs border-primary/20"
            class="flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-base-content/70 hover:bg-black/[0.03] hover:text-primary transition-all duration-200 border border-transparent group"
          >
            <div
              class="w-7 h-7 rounded-xl bg-black/[0.03] flex items-center justify-center shrink-0 group-hover:bg-primary/10 group-hover:text-primary transition-colors"
            >
              <lucide-icon [img]="item.icon" class="w-4 h-4"></lucide-icon>
            </div>

            <div class="flex flex-col min-w-0 flex-1">
              <span class="text-xs font-semibold leading-tight flex items-center justify-between w-full">
                {{ item.label }}
                @if (item.disabled) {
                  <span class="text-[8px] uppercase font-bold tracking-widest text-base-content/40 border border-base-content/10 px-1 py-0.2 rounded ml-1.5">Pronto</span>
                }
              </span>
              @if (item.description) {
                <span class="text-[10px] text-base-content/40 font-normal truncate mt-0.5">
                  {{ item.description }}
                </span>
              }
            </div>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Support Banner inside island -->
    <div class="p-3.5 rounded-2xl bg-emerald-500/5 border border-emerald-500/10 mt-3">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <p class="text-xs font-bold text-primary">Soporte B2B Activo</p>
      </div>
      <p class="text-[11px] text-base-content/60 mt-1 leading-relaxed">
        Línea directa para compras y facturación corporativa.
      </p>
    </div>
  </div>
</aside>

<!-- Mobile Horizontal Scroll Floating Pills -->
<nav
  class="md:hidden sticky top-16.5 z-20 -mx-4 px-4 py-2.5 mb-4 overflow-x-auto flex gap-2 no-scrollbar ios-glass border-y border-white/60"
>
  <a
    routerLink="/sales/catalog"
    class="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-emerald-600 to-teal-700 text-white text-xs font-bold whitespace-nowrap shadow-xs flex items-center gap-1.5 shrink-0"
  >
    <lucide-icon [img]="shoppingBagIcon" class="w-3.5 h-3.5"></lucide-icon>
    Catálogo B2B
  </a>
  <a
    *ngFor="let item of navItems"
    [routerLink]="item.disabled ? null : item.route"
    [class.opacity-40]="item.disabled"
    [class.pointer-events-none]="item.disabled"
    routerLinkActive="!bg-primary/15 !text-primary !border-primary/30 font-bold"
    class="px-3.5 py-1.5 rounded-full bg-white/80 border border-black/[0.06] text-xs font-semibold text-base-content/70 whitespace-nowrap transition-all shrink-0 flex items-center gap-1.5"
  >
    <lucide-icon [img]="item.icon" class="w-3.5 h-3.5"></lucide-icon>
    {{ item.label }}
  </a>
</nav>
