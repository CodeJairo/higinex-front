<aside
  class="hidden md:block w-64 shrink-0 border-r border-base-200 bg-base-100 rounded-xl md:rounded-2xl md:mt-4"
>
  <div class="px-4 py-3 border-b border-base-200">
    <h2 class="text-sm font-semibold text-slate-800">Configuración de cuenta</h2>
    <p class="text-xs text-slate-500 mt-1">Gestiona tu perfil, direcciones y preferencias.</p>
  </div>

  <ul class="menu p-3 gap-1 text-sm">
    <li *ngFor="let item of navItems" class="mt-0">
      <a
        [routerLink]="item.route"
        routerLinkActive="active btn-primary/10 text-primary font-medium"
        class="flex items-center gap-3 rounded-xl px-3 py-2 transition-all hover:bg-base-200/80 hover:text-slate-900"
      >
        <lucide-icon [img]="item.icon" class="w-4 h-4 text-slate-500"></lucide-icon>

        <div class="flex flex-col">
          <span class="font-medium text-slate-800">
            {{ item.label }}
          </span>
          @if (item.description) {
          <span class="text-[11px] text-slate-500">
            {{ item.description }}
          </span>
          }
        </div>
      </a>
    </li>
  </ul>
</aside>

<!-- Versión mobile: tabs horizontales simples -->
<nav class="md:hidden mb-4">
  <div class="tabs tabs-boxed w-full overflow-x-auto scrollbar-none">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="tab-active"
      class="tab text-xs whitespace-nowrap"
    >
      {{ item.label }}
    </a>
  </div>
</nav>
